name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'
      dry_run:
        description: 'Build, sign and verify only — do not publish a release'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: 🏷️ Determine Version Tag
        id: get_version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$REF_NAME"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Building APK for tag: $TAG"

      - name: ☕ Setup Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: 🔢 Verify the release tag matches the app version
        if: ${{ !inputs.dry_run }}
        run: |
          TAG="${{ steps.get_version.outputs.tag }}"
          APP_VERSION="$(node -p "require('./client/app.json').expo.version")"

          if [ "v${APP_VERSION}" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match client/app.json version $APP_VERSION."
            echo ""
            echo "The in-app update checker compares the release tag against expo.version in"
            echo "client/app.json. If the two disagree, users are either never offered the"
            echo "update or are offered one that never clears after installing it."
            echo ""
            echo "Bump expo.version in client/app.json (and version in client/package.json),"
            echo "commit, then tag the release again."
            exit 1
          fi
          echo "Tag $TAG matches client/app.json version $APP_VERSION."

      - name: 🔐 Verify signing secrets are configured
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$KEYSTORE_B64" ] && missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -z "$STORE_PASSWORD" ] && missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -z "$KEY_ALIAS" ] && missing="$missing ANDROID_KEY_ALIAS"
          [ -z "$KEY_PASSWORD" ] && missing="$missing ANDROID_KEY_PASSWORD"

          if [ -n "$missing" ]; then
            echo "::error::Missing required repository secret(s):$missing"
            echo ""
            echo "This workflow will not fall back to generating a throwaway keystore or to the"
            echo "public Android debug keystore. Either would let anyone publish an APK that"
            echo "Android accepts as an update to Amazon Scout."
            echo ""
            echo "See the 'Release signing secrets' section of README.md for the one-time setup."
            exit 1
          fi

          echo "All four signing secrets are present."

      - name: 📦 Install Client Dependencies
        run: |
          cd client
          npm install

      - name: ⚙️ Write signing properties for Gradle
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Secrets must not carry a trailing newline into a password. Guard here as
          # well as at the point of use: a corrupted password fails opaquely in Gradle.
          STORE_PASSWORD="$(printf '%s' "$STORE_PASSWORD" | tr -d '\r\n')"
          KEY_ALIAS="$(printf '%s' "$KEY_ALIAS" | tr -d '\r\n')"
          KEY_PASSWORD="$(printf '%s' "$KEY_PASSWORD" | tr -d '\r\n')"

          mkdir -p ~/.gradle
          # Deliberately outside the repository: these values are read by
          # client/plugins/withReleaseSigning.js and must never be committed.
          cat >> ~/.gradle/gradle.properties <<EOF
          AMAZONSCOUT_STORE_FILE=release.p12
          AMAZONSCOUT_KEY_ALIAS=$KEY_ALIAS
          AMAZONSCOUT_STORE_PASSWORD=$STORE_PASSWORD
          AMAZONSCOUT_KEY_PASSWORD=$KEY_PASSWORD
          EOF
          echo "Wrote signing properties to ~/.gradle/gradle.properties"

      - name: ⚙️ Generate Native Android Project (Expo Prebuild)
        run: |
          cd client
          npx expo prebuild --platform android --clean

      - name: 🔑 Restore the release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          # Must happen after prebuild, which recreates android/ from scratch.
          STORE_PASSWORD="$(printf '%s' "$STORE_PASSWORD" | tr -d '\r\n')"

          printf '%s' "$KEYSTORE_B64" | base64 -d > client/android/app/release.p12

          if [ ! -s client/android/app/release.p12 ]; then
            echo "::error::Decoded keystore is empty — is ANDROID_KEYSTORE_BASE64 valid base64?"
            exit 1
          fi

          # Fails the run before the build if the secrets do not match the keystore.
          keytool -list -storetype PKCS12 -keystore client/android/app/release.p12 -storepass "$STORE_PASSWORD" >/dev/null || {
            echo "::error::Could not open the PKCS#12 keystore with ANDROID_KEYSTORE_PASSWORD."
            exit 1
          }
          echo "Keystore restored and its password verified."

      - name: 🔨 Build Android Release APK
        run: |
          cd client/android
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: 📦 Prepare Release Artifact
        id: prepare_artifact
        run: |
          APK_DIR="client/android/app/build/outputs/apk/release"
          APK_FILE=$(find "$APK_DIR" -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "::error::No APK file generated in $APK_DIR"
            exit 1
          fi
          TAG="${{ steps.get_version.outputs.tag }}"
          TARGET_NAME="AmazonScout-${TAG}.apk"
          cp "$APK_FILE" "$APK_DIR/$TARGET_NAME"
          echo "apk_path=$APK_DIR/$TARGET_NAME" >> $GITHUB_OUTPUT
          echo "apk_name=$TARGET_NAME" >> $GITHUB_OUTPUT
          ls -la "$APK_DIR"

      - name: 🔎 Verify the APK is not debug-signed
        run: |
          APK="${{ steps.prepare_artifact.outputs.apk_path }}"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER="$(find "$SDK/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -n 1)"

          if [ -n "$APKSIGNER" ]; then
            CERTS="$("$APKSIGNER" verify --print-certs "$APK")"
          else
            echo "::warning::apksigner not found; falling back to keytool"
            CERTS="$(keytool -printcert -jarfile "$APK")"
          fi
          echo "$CERTS"

          if echo "$CERTS" | grep -qi 'Android Debug'; then
            echo "::error::This APK is signed with the public Android debug keystore. Refusing to publish."
            exit 1
          fi

          echo "$CERTS" | grep -iE 'certificate SHA-256|SHA256:' | head -n 2 || true
          echo "✅ Signed with a non-debug certificate."

      - name: 💾 Upload Artifact (Backup)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.prepare_artifact.outputs.apk_name }}
          path: ${{ steps.prepare_artifact.outputs.apk_path }}

      - name: 🚀 Publish to GitHub Releases
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: Amazon Scout ${{ steps.get_version.outputs.tag }}
          body: |
            ## ⚡ Amazon Scout ${{ steps.get_version.outputs.tag }} — Standalone Release

            ### 🌟 Features:
            - **100% Serverless & On-Device**: Lightning-fast barcode & ISBN recognition powered by Google ML Kit.
            - **Canadian Amazon (`Amazon.ca`) Optimized**: Canadian Dollar (`CDN$`) pricing and Canadian publisher/media gating warnings (*Nelson Education, McGraw-Hill Ryerson, eOne Canada, Pearson, Disney*).
            - **In-App Update Checker**: Tap **⚙️ Settings → Check for Updates** anytime to install future releases.
            - **Offline Queue**: Keep scanning in zero-service thrift store basements and sync later.

            ### 📲 How to Install on Android:
            1. Download the **`${{ steps.prepare_artifact.outputs.apk_name }}`** asset attached below directly on your Android phone.
            2. Open the downloaded file to install.
            3. If prompted, allow *"Install unknown apps"* for your browser.
            4. **Done!** The app icon is now on your home screen.
          files: |
            ${{ steps.prepare_artifact.outputs.apk_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
