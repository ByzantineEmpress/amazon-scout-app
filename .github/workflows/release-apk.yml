name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🏷️ Determine Version Tag
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Building APK for tag: $TAG"

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📱 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install Client Dependencies
        run: |
          cd client
          npm install

      - name: ⚙️ Generate Native Android Project (Expo Prebuild)
        run: |
          cd client
          npx expo prebuild --platform android --clean

      - name: 🔑 Configure Release Keystore & Gradle Signing
        run: |
          cd client/android/app
          # Generate signing keystore
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias amazonscout \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass scoutpass123 \
            -keypass scoutpass123 \
            -dname "CN=AmazonScout, OU=Mobile, O=AmazonScout, L=Toronto, ST=ON, C=CA"

          # Update build.gradle to ensure release signing is applied
          node -e '
            const fs = require("fs");
            let bg = fs.readFileSync("build.gradle", "utf8");
            
            // Insert signingConfig if missing or set release signing
            if (!bg.includes("signingConfigs.release")) {
              bg = bg.replace(/signingConfigs\s*\{/, `signingConfigs {\n        release {\n            storeFile file("release.keystore")\n            storePassword "scoutpass123"\n            keyAlias "amazonscout"\n            keyPassword "scoutpass123"\n        }`);
              bg = bg.replace(/buildTypes\s*\{\s*release\s*\{/, `buildTypes {\n        release {\n            signingConfig signingConfigs.release`);
              fs.writeFileSync("build.gradle", bg);
              console.log("Configured release signingConfig in build.gradle");
            }
          '

      - name: 🔨 Build Android Release APK
        run: |
          cd client/android
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: 📦 Prepare Release Artifact
        id: prepare_artifact
        run: |
          APK_DIR="client/android/app/build/outputs/apk/release"
          APK_FILE=$(find "$APK_DIR" -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "::error::No APK file generated in $APK_DIR"
            exit 1
          fi
          TAG="${{ steps.get_version.outputs.tag }}"
          TARGET_NAME="AmazonScout-${TAG}.apk"
          cp "$APK_FILE" "$APK_DIR/$TARGET_NAME"
          echo "apk_path=$APK_DIR/$TARGET_NAME" >> $GITHUB_OUTPUT
          echo "apk_name=$TARGET_NAME" >> $GITHUB_OUTPUT
          ls -la "$APK_DIR"

      - name: 💾 Upload Artifact (Backup)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare_artifact.outputs.apk_name }}
          path: ${{ steps.prepare_artifact.outputs.apk_path }}

      - name: 🚀 Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: Amazon Scout ${{ steps.get_version.outputs.tag }}
          body: |
            ## ⚡ Amazon Scout ${{ steps.get_version.outputs.tag }} — Standalone Release

            ### 🌟 Features:
            - **100% Serverless & On-Device**: Lightning-fast barcode & ISBN recognition powered by Google ML Kit.
            - **Canadian Amazon (`Amazon.ca`) Optimized**: Canadian Dollar (`CDN$`) pricing and Canadian publisher/media gating warnings (*Nelson Education, McGraw-Hill Ryerson, eOne Canada, Pearson, Disney*).
            - **In-App Update Checker**: Tap **⚙️ Settings → Check for Updates** anytime to install future releases.
            - **Offline Queue**: Keep scanning in zero-service thrift store basements and sync later.

            ### 📲 How to Install on Android:
            1. Download the **`${{ steps.prepare_artifact.outputs.apk_name }}`** asset attached below directly on your Android phone.
            2. Open the downloaded file to install.
            3. If prompted, allow *"Install unknown apps"* for your browser.
            4. **Done!** The app icon is now on your home screen.
          files: |
            ${{ steps.prepare_artifact.outputs.apk_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
