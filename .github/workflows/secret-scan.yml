name: Secret scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Scan for committed credentials
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository (full history)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0

      - name: 🔎 Scan working tree and history for credentials
        run: bash scripts/secret-scan.sh
